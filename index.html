html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:#fff;font:400 16px/1.7 Cairo,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-weight:900;line-height:1.2;margin:0}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,100% - 36px);margin-inline:auto}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:14px;height:68px}
.bar .lg{height:40px;margin-inline-end:auto}
nav{display:flex;gap:26px;font-weight:600;font-size:.95rem}
nav a:hover{color:var(--or)}
.lang{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mu);font:800 .8rem Cairo,sans-serif;padding:7px 10px;cursor:pointer}
.lang button.on{background:var(--or);color:#000}
.menu{display:none;background:none;border:0;color:#fff;padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;font:800 .95rem Cairo,sans-serif;border:2px solid var(--or);border-radius:10px;cursor:pointer;transition:.2s;background:transparent;color:#fff}
.btn.p{background:var(--or);color:#000}.btn.p:hover{background:#fff;border-color:#fff}.btn.o:hover{background:var(--or);color:#000}
section{padding:84px 0}
.head{margin-bottom:40px}.head h2{font-size:clamp(2rem,5vw,3.2rem)}
.head h2::after{content:"";display:block;width:64px;height:4px;background:var(--or);margin-top:12px;border-radius:2px}
.head p{color:var(--mu);margin:12px 0 0;max-width:36em}
/* hero 3D */
.hero{padding:34px 0 40px;background:radial-gradient(800px 420px at 50% 62%,rgba(255,90,0,.22),transparent 70%)}
.hero .tx{text-align:center;max-width:760px;margin-inline:auto}
.hero .big{width:min(420px,80%);margin-bottom:6px}
.hero h1{font-size:clamp(1.9rem,5vw,3.4rem)}.hero h1 b{color:var(--or)}
.hero p{color:#ddd;margin:10px 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.stage{perspective:1100px;height:clamp(330px,52vw,430px);margin-top:22px;cursor:grab;touch-action:pan-y;user-select:none;position:relative}
.stage:active{cursor:grabbing}
.stage::after{content:"";position:absolute;left:12%;right:12%;bottom:4%;height:26px;background:radial-gradient(closest-side,rgba(255,90,0,.5),transparent);filter:blur(8px)}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.pn{position:absolute;border-radius:14px;overflow:hidden;border:1px solid #ffffff30;box-shadow:0 18px 40px #000a;backface-visibility:visible}
.pn img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hint{text-align:center;color:var(--mu);font-size:.85rem;margin-top:8px}
/* services */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;perspective:1000px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:28px 24px;transition:transform .15s,border-color .3s;transform-style:preserve-3d}
.card:hover{border-color:var(--or)}
.card .ic{width:42px;height:42px;color:var(--or);margin-bottom:14px;transform:translateZ(30px)}
.card h3{font-size:1.35rem;margin-bottom:8px;transform:translateZ(20px)}.card p{margin:0;color:var(--mu);font-size:.95rem}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;perspective:1000px}
.tile{position:relative;aspect-ratio:3/4;border:1px solid var(--ln);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;background:#0f0f0f;color:#fff;transition:transform .15s;transform-style:preserve-3d;box-shadow:0 14px 30px #0008}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;inset:auto 0 0;padding:34px 14px 12px;background:linear-gradient(transparent,#000d);font:800 1.05rem Cairo,sans-serif;text-align:start}
.tile:hover{border-color:var(--or)}
/* videos */
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;perspective:1000px}
.vd{position:relative;aspect-ratio:464/848;border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:#0f0f0f;cursor:pointer;transition:transform .15s;transform-style:preserve-3d;box-shadow:0 14px 30px #0008}
.vd video{width:100%;height:100%;object-fit:cover;display:block}
.vd i{position:absolute;inset-inline-end:10px;top:10px;background:#000a;border-radius:20px;padding:4px 10px;font:800 .75rem Cairo,sans-serif;font-style:normal}
/* why/contact */
.why{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.why p{color:var(--mu)}.why ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.why li{display:flex;gap:10px}.why li .ic{color:var(--or);margin-top:6px}
.stat{display:flex;align-items:baseline;gap:18px;background:var(--sf);border:1px solid var(--ln);border-inline-start:4px solid var(--or);border-radius:12px;padding:16px 24px;margin-bottom:12px}
.stat b{font:900 clamp(2.4rem,6vw,3.4rem)/1 Cairo,sans-serif;color:var(--or);min-width:2.4em;direction:ltr;text-align:center}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.ctc{display:grid;gap:14px;align-content:start}
.ctc a.row{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;font-weight:800;transition:.2s}
.ctc a.row:hover{border-color:var(--or);color:var(--or)}.ctc .ic{color:var(--or);width:26px;height:26px}
.ctc .num{direction:ltr}
form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);color:#fff;padding:12px 14px;font:400 16px Cairo,sans-serif;border-radius:10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or)}
footer{border-top:1px solid var(--ln);padding:30px 0;color:var(--mu);font-size:.9rem}
.fr{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:58px;height:58px;border-radius:50%;background:var(--or);color:#000;display:grid;place-items:center;box-shadow:0 8px 26px rgba(255,90,0,.5)}
.fab .ic{width:28px;height:28px}
.lb{position:fixed;inset:0;z-index:100;background:#000e;display:none;align-items:center;justify-content:center;padding:16px}.lb.on{display:flex}
.lbc{position:relative;width:min(520px,100%);max-height:100%;background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.lbc img{width:100%;max-height:72vh;object-fit:contain;display:block;background:#000}
.lbc div{padding:14px 18px;font-weight:800;font-size:1.2rem}
.lbc button{position:absolute;top:45%;background:#000a;border:1px solid var(--ln);color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.3rem}
.lbc .x{top:10px;inset-inline-end:10px}.lbc .pv{inset-inline-start:8px}.lbc .nx{inset-inline-end:8px}

 nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--ln);display:none;padding:6px 18px 12px}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.rv{opacity:1;transform:none}}
